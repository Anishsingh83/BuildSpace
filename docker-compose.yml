services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildspace_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: buildspace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildspace_user -d buildspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://buildspace_user:${POSTGRES_PASSWORD}@db:5432/buildspace
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: '["${SITE_URL:?Set SITE_URL in .env}"]'
      # Safe only because the API port is never published: nginx is its only caller.
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"

volumes:
  pgdata: