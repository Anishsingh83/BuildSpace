name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: buildspace_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: buildspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildspace_user -d buildspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://buildspace_user:ci_only_password@localhost:5432/buildspace_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: buildspace_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: buildspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildspace_user -d buildspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for a database and server that exist only for this job.
      DATABASE_URL: postgresql+psycopg://buildspace_user:ci_only_password@localhost:5432/buildspace
      JWT_SECRET: ci-only-throwaway-secret-0123456789-abcdefghij
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Start the API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          cat ../api.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the smoke test
        working-directory: frontend
        run: npm run e2e
      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
          if-no-files-found: ignore
  docker:
    name: Docker build and stack test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
      SITE_URL: http://localhost:8080
      POSTGRES_PASSWORD: ci_only_password
      JWT_SECRET: ci-only-throwaway-secret-0123456789-abcdefghij
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Check the stack through nginx
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/v1/health
          curl -sI http://127.0.0.1:8080/ | grep -i "content-security-policy"
          curl -sf http://127.0.0.1:8080/p/some-slug | grep -q 'id="root"'
          curl -sf -X POST http://127.0.0.1:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","email":"ci@example.com","password":"ci-long-password-123"}'
      - name: Show logs when something fails
        if: failure()
        run: docker compose logs --no-color